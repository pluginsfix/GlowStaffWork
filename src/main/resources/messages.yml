  - "[message]   &#FFFF00◆ &fОтработано сегодня: &#FFFF00{today_time}"
  - "[message]   &#FFFF00◆ &fВсего отработано: &#FFFF00{total_time}"
  - "[message]   &#FFFF00◆ &fВсего смен: &#FFFF00{sessions_count}"
  - "[message]   &#FFFF00◆ &fВыдано банов: &#FFFF00{bans_count}"
